name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      AURAMED_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile the package
        run: python -m compileall -q backend

      - name: Run the test suite (incl. the whole-gateway contract suite)
        run: python -m pytest -q

      - name: Verify all 26 nodes stay routable (OpenAPI schema builds)
        run: |
          python - <<'PY'
          from backend.main import app

          paths = app.openapi()["paths"]
          covered = {
              int(part)
              for path in paths
              if path.startswith("/api/v1/")
              for part in [path.split("/")[3]]
              if part.isdigit()
          }
          missing = sorted(set(range(1, 27)) - covered)
          assert not missing, f"nodes without an HTTP route: {missing}"
          print(f"OK - all 26 nodes routable across {len(paths)} OpenAPI paths")
          PY
